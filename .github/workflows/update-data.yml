# 抱石地圖的資料更新
#
#   - 補座標＋OSM 交叉比對（src/enrich.py）：每週一次，或館資料、來源、程式有改時
#   - YouBike 車數另外在 youbike.yml（每 20 分鐘，存在 youbike-data 分支，不 commit 到 main）
#
# 容器內連不到 OpenStreetMap，所以在 GitHub 的主機上跑。
# 注意：schedule 只會在預設分支（main）上執行；在開發分支上是靠 push 觸發。

name: 抱石地圖資料

on:
  schedule:
    - cron: "15 18 * * 0"     # 每週一 02:15（台灣時間）重新補座標
  push:
    paths:
      - "data/manual/**"
      - "data/raw/sources.csv"
      - "src/**"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:

concurrency:
  group: climbing-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 補座標、OSM 交叉比對
        run: python src/enrich.py

      - name: 存回 repo
        run: |
          git config user.name "climbing-data-bot"
          git config user.email "climbing-data-bot@users.noreply.github.com"
          git add data docs
          git commit -q -m "抱石地圖資料 $(date '+%m/%d %H:%M')" || exit 0
          for i in 1 2 3; do
            if git pull -q --rebase; then git push -q && break; else git rebase --abort; fi
            sleep 10
          done
