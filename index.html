<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>附近抱石館地圖</title>
<meta name="description" content="用手機定位找附近的室內抱石館，看價格、營業時間、影片和留言，並提供大眾運輸與 YouBike 交通建議。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>附近抱石館</h1>
  <button id="locate" class="btn primary" type="button">📍 定位</button>
</header>

<div class="layout">
  <div id="map" role="application" aria-label="抱石館地圖"></div>

  <aside class="panel" id="panel">
    <div class="handle" id="handle" aria-hidden="true"></div>
    <div id="status" class="status">正在載入資料…</div>

    <div class="filters">
      <label>範圍
        <select id="radius">
          <option value="3">3 公里</option>
          <option value="5">5 公里</option>
          <option value="10" selected>10 公里</option>
          <option value="30">30 公里</option>
          <option value="0">全部</option>
        </select>
      </label>
      <label><input type="checkbox" id="boulderOnly" checked> 只看有抱石</label>
      <label><input type="checkbox" id="showUnverified" checked> 顯示待確認</label>
      <label><input type="checkbox" id="showOsm"> OSM 補充地點</label>
    </div>

    <ul id="list" class="list"></ul>
    <details id="nocoord" class="nocoord" hidden>
      <summary>位置待補的館</summary>
      <ul id="nocoordList" class="list"></ul>
    </details>
    <p class="foot">
      資料整理於 <span id="checked">—</span>，價格與營業時間可能已變動，出發前請向館方確認。
      <a href="https://github.com/tim062480-create/ntu-youbike/blob/main/climbing/%E8%B3%87%E6%96%99%E4%BE%86%E6%BA%90%E7%B4%80%E9%8C%84.md" target="_blank" rel="noopener">資料來源與驗證方法</a>
    </p>
  </aside>
</div>

<section id="detail" class="detail" hidden aria-live="polite">
  <button id="closeDetail" class="close" type="button" aria-label="關閉">✕</button>
  <div id="detailBody"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
